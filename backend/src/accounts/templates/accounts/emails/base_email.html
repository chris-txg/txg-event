<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Event Manager {% endblock %}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fbf7f8;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
        Helvetica, Arial, sans-serif;
      color: #30232a;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background-color: #fbf7f8; padding: 36px 16px"
    >
      <tr>
        <td align="center">
          <!-- Single Unified Card -->
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 580px;
              background-color: #ffffff;
              border: 1px solid #e9dde1;
              border-radius: 20px;
              overflow: hidden;
              box-shadow: 0 10px 28px rgba(66, 24, 39, 0.08);
            "
          >
            <!-- Header Strip -->
            <tr>
              <td
                style="
                  background-color: #421827;
                  background-image: linear-gradient(
                    112deg,
                    #421827 0%,
                    #5c2337 55%,
                    #7b354f 100%
                  );
                  padding: 24px 32px;
                "
              >
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td>
                      <table
                        role="presentation"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                      >
                        <tr>
                          <td
                            width="36"
                            height="36"
                            align="center"
                            valign="middle"
                            style="
                              background-color: #ffffff;
                              color: #421827;
                              font-size: 17px;
                              font-weight: 900;
                              border-radius: 10px;
                              line-height: 36px;
                            "
                          >
                            E
                          </td>
                          <td style="padding-left: 12px">
                            <span
                              style="
                                display: block;
                                font-size: 18px;
                                font-weight: 800;
                                color: #fff8fa;
                                letter-spacing: -0.02em;
                              "
                            >
                              Event Manager
                            </span>
                            <span
                              style="
                                display: block;
                                font-size: 11px;
                                font-weight: 600;
                                color: #f4d5df;
                                margin-top: 2px;
                              "
                            >
                              One Platform. Every Event.
                            </span>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Main Content -->
            <tr>
              <td style="padding: 34px 32px 30px 32px">
                {% block content %} {% endblock %}
              </td>
            </tr>

            <!-- Integrated Footer -->
            <tr>
              <td
                style="
                  background-color: #fbf7f8;
                  border-top: 1px solid #e9dde1;
                  padding: 20px 32px;
                  text-align: center;
                "
              >
                <p
                  style="
                    margin: 0 0 6px 0;
                    font-size: 11px;
                    color: #75666d;
                    line-height: 1.55;
                  "
                >
                  {% block footer_note %} You received this automated email
                  regarding your Event Manager account. {% endblock %}
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 11px;
                    font-weight: 600;
                    color: #542037;
                  "
                >
                  &copy; 2026 Event Manager. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

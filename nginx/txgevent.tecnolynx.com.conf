# ==============================================================================
# Nginx Configuration: TxgEvent Subpath Architecture
# Domain: https://tecnolynx.com
# Application Root: /txgevent
#
# Upstreams / Ports on VPS:
#   - Next.js Frontend (BFF + Pages + Assets): 127.0.0.1:3005
#   - Django Backend (Admin + Direct WSGI):    127.0.0.1:8005
#
# Target File on VPS: /etc/nginx/sites-available/tecnolynx.com.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Next.js Frontend Application & BFF Route Handlers
#
# IMPORTANT:
#   - Do NOT add a trailing slash to the proxy_pass directive (http://127.0.0.1:3005).
#   - Because Next.js has `basePath: '/txgevent'`, Next.js natively expects the
#     full path starting with `/txgevent/...`.
#   - This block handles:
#       * Pages: /txgevent/login, /txgevent/register, /txgevent/profile, etc.
#       * Static assets: /txgevent/_next/static/...
#       * Auth BFF APIs: /txgevent/api/auth/register, /txgevent/api/auth/login, etc.
#       * Project APIs: /txgevent/api/projects...
# ------------------------------------------------------------------------------
location /txgevent {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;

    # WebSocket and SSE support for Turbopack/Next.js Fast Refresh
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Standard proxy headers for host and IP attribution
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# ------------------------------------------------------------------------------
# 2. Django Direct Backend Administration & Swagger Docs
#
# Used strictly for:
#   - Django Admin: /txgevent/backend/admin/
#   - Swagger UI:   /txgevent/backend/api/docs/
#
# The rewrite strips '/txgevent/backend/' so Django WSGI receives clean root URLs.
# ------------------------------------------------------------------------------
location /txgevent/backend/ {
    rewrite ^/txgevent/backend/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8005;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_redirect / /txgevent/backend/;

    client_max_body_size 25M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

# ------------------------------------------------------------------------------
# 3. Static and Media files for Django Administration
# ------------------------------------------------------------------------------
location /txgevent/backend/static/ {
    alias /var/www/txgevent/backend/staticfiles/;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location /txgevent/backend/media/ {
    alias /var/www/txgevent/backend/media/;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
}

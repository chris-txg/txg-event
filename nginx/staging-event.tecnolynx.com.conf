# ==============================================================
# Nginx Configuration: STAGING
# Domains:
#   - Frontend: staging-event.tecnolynx.com
#   - Backend:  api.staging-event.tecnolynx.com
# Location on VPS: /etc/nginx/sites-available/staging-event.tecnolynx.com.conf
# ==============================================================

# 1. Staging Frontend (Next.js)
server {
    listen 80;
    server_name staging-event.tecnolynx.com;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        # Proxy to Staging Frontend container port (default 3001 or 3000)
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Staging Backend API (Django REST Framework)
server {
    listen 80;
    server_name api.staging-event.tecnolynx.com;

    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript text/xml;

    location / {
        # Proxy to Staging Backend container port (default 8001 or 8000)
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}


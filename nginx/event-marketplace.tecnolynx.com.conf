# ==============================================================
# Nginx Configuration: PRODUCTION
# Domains:
#   - Frontend: event-marketplace.tecnolynx.com
#   - Backend:  api.event-marketplace.tecnolynx.com
# Location on VPS: /etc/nginx/sites-available/event-marketplace.tecnolynx.com.conf
# ==============================================================

# 1. Production Frontend (Next.js)
server {
    listen 80;
    server_name event-marketplace.tecnolynx.com;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        # Proxy to Production Frontend container port (e.g. 3000)
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Production Backend API (Django REST Framework)
server {
    listen 80;
    server_name api.event-marketplace.tecnolynx.com;

    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript text/xml;

    location / {
        # Proxy to Production Backend container port (e.g. 8000)
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}

